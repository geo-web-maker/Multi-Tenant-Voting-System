<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KES Blueprint Console mockups</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#14161c;color:#eee;height:100dvh;display:flex;flex-direction:column}
.tb{display:flex;flex-wrap:wrap;gap:8px 16px;padding:8px 12px;background:#0c0e13;align-items:center}.tb .g{display:flex;gap:4px;align-items:center}.tb span{opacity:.5;font-size:11px;text-transform:uppercase}
.tb button,.tb select{border:1px solid #444;background:#20232b;color:#eee;padding:6px 12px;border-radius:99px;font:inherit;cursor:pointer}.tb button.on{background:#ff922b;border-color:#ff922b;color:#0b2545;font-weight:700}
#st{flex:1;position:relative;overflow:auto;display:grid;place-items:start center;padding:12px}#sc{transform-origin:0 0}
/* ===== SPACING SYSTEM: 4px base, 8px rhythm. Only these steps are used. ===== */
.dev{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--gut:var(--s5);--pad:var(--s5);--hh:64px;--tap:48px;--r:12px;--rs:8px;
--fm:ui-monospace,Menlo,Consolas,monospace;--fh:var(--fm);--sh:0 8px 24px rgba(11,37,69,.10);
position:relative;overflow:hidden;border-radius:16px;font:14px/24px system-ui,sans-serif;color:var(--tx);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;display:flex;flex-direction:column}
.dev.m{--gut:var(--s4);--pad:var(--s4);--hh:56px}
/* ===== TINT SYSTEM: surface steps + 10% status tints, all AA-checked ===== */
.dev[data-t=light]{--bg:#e9ecef;--sf:#fff;--sf2:#f1f3f5;--sf3:#fff;--line:#ced4da;--tx:#14213d;--mu:#5c677d;--ac:#c2410c;--ai:#fff;--ok:#1b6e2f;--wn:#8f4d00;--no:#b42323;--grid:rgba(20,33,61,.06)}
.dev[data-t=dark]{--bg:#0b2545;--sf:#10335f;--sf2:#0d2b52;--sf3:#143b6e;--line:#2b4f80;--tx:#e8f0fb;--mu:#a3b8d4;--ac:#ff922b;--ai:#0b2545;--ok:#69db7c;--wn:#ffc078;--no:#ffa3a3;--grid:rgba(255,255,255,.05);--sh:0 8px 24px rgba(0,0,0,.35)}
.dev{--tint:color-mix(in srgb,var(--ac) 10%,var(--sf));--tint2:color-mix(in srgb,var(--ac) 18%,var(--sf))}
.dev h1,.dev h2,.dev h3{font-family:var(--fh);text-transform:uppercase;margin:0 0 var(--s4);letter-spacing:.02em}.dev h1{font-size:24px;line-height:32px}.dev h2{font-size:16px;line-height:24px;margin-bottom:var(--s3)}
.mono,.num{font-family:var(--fm)}.mu{color:var(--mu)}.sc{overflow:auto;flex:1}
/* ===== HEADER: drawing title block · 64 tall · 12 outer margin · 16 cell padding · dashed dividers · ruler edge ===== */
.top{position:sticky;top:0;z-index:3;display:flex;align-items:stretch;height:var(--hh);flex:none;margin:var(--s3) var(--gut) var(--s4);background:var(--sf3);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.tl{flex:1;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);min-width:0}
.logo{position:relative;display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:var(--rs);background:var(--ac);color:var(--ai);font:700 12px var(--fm);font-style:normal}
.logo::before{content:'';position:absolute;inset:-4px;border:1px dashed color-mix(in srgb,var(--ac) 60%,transparent);border-radius:12px}
.bt{display:flex;flex-direction:column;min-width:0}.bt b,.bt small{font:700 12px/16px var(--fm);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt small{font-size:11px;font-weight:500;color:var(--mu)}
.top nav,.crumb,.cell{display:flex;align-items:center;padding:0 var(--s4);border-left:1px dashed var(--line)}.top nav{gap:var(--s1)}
.top nav a{display:flex;align-items:center;height:40px;padding:0 var(--s4);border-radius:var(--rs);color:var(--mu);font:600 13px/16px system-ui}.top nav a.on{background:var(--ac);color:var(--ai)}
.crumb{gap:var(--s2);font:600 13px/16px system-ui;white-space:nowrap}.crumb i{font-style:normal;color:var(--mu)}
.cell{flex-direction:column;justify-content:center;align-items:flex-start;gap:0}.cell small{font:700 10px/16px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.cell b{font:700 13px/16px var(--fm);white-space:nowrap}.dot.ok{background:var(--ok)}
.rule{position:absolute;left:var(--s3);right:var(--s3);bottom:0;height:8px;pointer-events:none;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 8px) 0 100%/100% 4px no-repeat,repeating-linear-gradient(90deg,var(--ac) 0 1px,transparent 1px 48px) 0 100%/100% 8px no-repeat}
.wrap{max-width:520px;margin:0 auto;padding:0 var(--gut) var(--s6)}
.card{background:var(--sf);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:var(--r);padding:var(--pad);margin-bottom:var(--s4);box-shadow:var(--sh)}
label{display:block;font:700 12px/16px var(--fm);color:var(--mu);margin:var(--s4) 0 var(--s2);text-transform:uppercase;letter-spacing:.06em}
.in{display:flex;align-items:center;padding:0 var(--s3);min-height:var(--tap);color:var(--tx);background:var(--sf2);border:1px solid var(--line);border-radius:var(--rs)}.in.f{outline:2px solid var(--ac);outline-offset:1px}
.btn{display:flex;align-items:center;justify-content:center;min-height:var(--tap);padding:0 var(--s5);border-radius:99px;background:var(--ac);color:var(--ai);font:700 14px system-ui;margin-top:var(--s4);cursor:pointer}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn.sm{display:inline-flex;min-height:40px;padding:0 var(--s4);margin:0;font-size:13px}
.lnk{text-align:center;margin-top:var(--s4);color:var(--ac);font-weight:600}
.ban{padding:var(--s3) var(--s4);border-radius:var(--rs);background:color-mix(in srgb,var(--ok) 10%,var(--sf));border-left:4px solid var(--ok);margin-bottom:var(--s3)}.ban.w{background:color-mix(in srgb,var(--wn) 10%,var(--sf));border-color:var(--wn)}
.pos{display:inline-block;padding:var(--s1) var(--s4);margin:var(--s5) 0 var(--s3);background:var(--ac);color:var(--ai);border-radius:99px;font:700 12px/24px var(--fh);text-transform:uppercase;letter-spacing:.08em}
.cand{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);margin-bottom:var(--s3);min-height:72px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.av{width:48px;height:48px;flex:none;border-radius:50%;background:var(--tint);border:1px solid var(--line);display:grid;place-items:center;font:700 14px var(--fm);color:var(--mu);font-style:normal}
.cand b{flex:1}.tick{width:28px;height:28px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ai);font-weight:700}.cand.on{border-color:var(--ac);outline:2px solid var(--ac);background:var(--tint)}.cand.on .tick{background:var(--ac);border-color:var(--ac)}
.dock{display:flex;gap:var(--s2);padding:var(--s3);margin:0 var(--gut) var(--s3);background:var(--sf3);border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh)}.dock .btn{flex:1;margin:0}
.big{font:800 40px/48px var(--fm);color:var(--ac)}.stat{text-align:center}
.pill{--c:var(--ok);display:inline-flex;align-items:center;height:24px;padding:0 var(--s3);border-radius:99px;font:700 11px system-ui;color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--sf));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);text-transform:uppercase;white-space:nowrap}.pill.w{--c:var(--wn)}.pill.n{--c:var(--no)}.pill.m{--c:var(--mu)}
.row{margin:var(--s4) 0}.row .t{display:flex;justify-content:space-between;gap:var(--s2);font-weight:600}.bar{height:8px;margin-top:var(--s2);background:var(--sf2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mu);border-radius:99px}.row.w .bar i{background:var(--ac)}
.shell{display:grid;grid-template-columns:240px 1fr;gap:var(--s4);flex:1;min-height:0}.wide{max-width:720px}.side h3:first-child{margin-top:var(--s2)}.side{margin:0 0 var(--s3) var(--gut);padding:var(--s3);background:var(--sf3);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto}
.side h3{font-size:11px;line-height:16px;color:var(--mu);margin:var(--s5) var(--s3) var(--s2)}.side .brand{margin:var(--s1) var(--s2) 0}.side a{display:flex;align-items:center;min-height:40px;padding:0 var(--s3);border-radius:var(--rs);font-size:14px}.side a.on{background:var(--ac);color:var(--ai);font-weight:700}
.main{padding:0 var(--gut) var(--s5) 0;min-width:0;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);margin-bottom:var(--s4)}.grid .card{margin:0}.g2{grid-template-columns:2fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font:700 11px/16px var(--fm);text-transform:uppercase;color:var(--mu);padding:var(--s2) var(--s3);border-bottom:2px solid var(--line);white-space:nowrap}td{padding:var(--s3);border-bottom:1px solid var(--line)}.ov{overflow-x:auto}
.cen{display:grid;place-items:center;flex:1;padding:var(--s5)}.cen .card{max-width:384px;text-align:center;padding:var(--s7) var(--s6)}.cen .logo{width:72px;height:72px;margin:0 auto var(--s5);font-size:20px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--wn);margin-right:var(--s2);animation:p 1.2s infinite}@keyframes p{50%{opacity:.3}}
.otp{display:flex;gap:var(--s2);justify-content:center;margin:var(--s5) 0}.otp i{width:48px;height:56px;border:1px solid var(--line);background:var(--sf2);border-radius:var(--rs);display:grid;place-items:center;font:700 24px var(--fm);font-style:normal}
.steps{display:flex;gap:var(--s2);margin:0 0 var(--s4)}.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}.steps i.on{background:var(--ac)}
.chart{display:flex;align-items:flex-end;gap:var(--s1);height:120px}.chart i{flex:1;background:var(--ac);border-radius:var(--s1) var(--s1) 0 0}
.hot{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--s1)}.hot i{aspect-ratio:1;border-radius:var(--s1);background:var(--ac)}.two{display:grid;grid-template-columns:1fr 288px;gap:var(--s4)}.chip{display:inline-block;padding:var(--s1) var(--s3);border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--mu)}
.alt{background:color-mix(in srgb,var(--no) 10%,var(--sf));border-radius:var(--rs);padding:var(--s3) var(--s4);margin-top:var(--s2);border-left:4px solid var(--no)}
/* ===== MOBILE: 56 header, 16 gutters, 48 tap targets, bottom pill nav ===== */
.m .top{height:auto;flex-wrap:wrap;margin:var(--s2) var(--gut) var(--s3)}.m .tl,.m .cell{min-height:var(--hh)}.m .tl{padding:0 var(--s3);gap:var(--s3)}.m .logo{width:36px;height:36px}.m .bt b{font-size:11px;letter-spacing:.04em}.m .cell{padding:0 var(--s3)}.m .cell small,.m .cell.sh,.m .crumb,.m .lg{display:none}.m .top nav{order:3;flex:1 0 100%;padding:var(--s2) var(--s2) var(--s3);border-left:0;border-top:1px dashed var(--line)}.m .top nav a{flex:1;justify-content:center}
.m .shell{display:flex;flex-direction:column;gap:0}.m .side{order:2;margin:0 var(--gut) var(--s3);padding:var(--s2);display:flex;gap:var(--s1);overflow-x:auto;border-radius:28px;flex:none}.m .side h3,.m .side .brand{display:none}.m .side a{white-space:nowrap;border-radius:99px;min-height:44px;padding:0 var(--s4)}.m .main{padding:0 var(--gut) var(--s4);order:1;flex:1}
.m .grid,.m .g2,.m .g4,.m .two{grid-template-columns:1fr}.m .grid.k{grid-template-columns:1fr 1fr}.m .big{font-size:32px;line-height:40px}.m .otp i{width:44px;height:52px}.m .cen .card{padding:var(--s6) var(--s5)}
.m table.rs thead{display:none}.m table.rs tr{display:block;border:1px solid var(--line);border-radius:var(--rs);margin-bottom:var(--s2);padding:var(--s1)}.m table.rs td{display:flex;justify-content:space-between;gap:var(--s3);border:0;padding:var(--s1) var(--s2)}.m table.rs td:before{content:attr(data-l);font:700 11px/24px var(--fm);color:var(--mu);text-transform:uppercase}
/* ===== SPEC page + Guides overlay ===== */
.sp{display:flex;align-items:center;gap:var(--s3);margin:var(--s2) 0}.sp i{display:block;height:16px;background:var(--ac);border-radius:var(--s1)}.sp b{width:48px;font:600 12px var(--fm)}.sw{display:flex;gap:var(--s2);flex-wrap:wrap}.sw i{width:56px;height:56px;border-radius:var(--rs);border:1px solid var(--line);display:grid;place-items:end start;padding:var(--s1);font:600 10px var(--fm);font-style:normal;color:var(--tx)}
.gd::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(to bottom,rgba(255,0,110,.22) 0 1px,transparent 1px 8px)}
.gd .top,.gd .card,.gd .dock,.gd .side,.gd .cand{outline:1px dashed #ff006e;outline-offset:0}.gd .top::after{content:'header 64 · outer 12 · cell 16 · gutter 24';position:absolute;top:100%;left:var(--s4);font:700 10px/16px var(--fm);background:#ff006e;color:#fff;padding:0 var(--s1);white-space:nowrap}.gd.m .top::after{content:'header 56 + tabs · outer 8/16 · gutter 16'}
</style></head><body>
<div class="tb"><div class="g"><span>Theme</span><button data-k=t data-v=light>Light</button><button data-k=t data-v=dark>Dark</button></div>
<div class="g"><span>View</span><button data-k=v data-v=desktop>Desktop</button><button data-k=v data-v=mobile>Mobile</button></div>
<div class="g"><span>Guides</span><button id="gd">Off</button></div>
<div class="g"><span>Page</span><select id="pg"></select><button id="pv">&larr;</button><button id="nx">&rarr;</button></div></div>
<div id="st"><div id="sc"><div class="dev" id="dev"></div></div></div>
<script>
const $=s=>document.querySelector(s),S={g:0,t:'light',v:innerWidth<700?'mobile':'desktop',p:'login',...Object.fromEntries(new URLSearchParams(location.hash.slice(1)))};
const cells=()=>`<div class="cell st"><small>Status</small><b><i class="dot ok"></i><span class="lg">Voting </span>Open</b></div><div class="cell sh"><small>Sheet</small><b>${String(L.findIndex(x=>x[0]==S.p)+1).padStart(2,'0')} / ${L.length}</b></div><i class="rule"></i>`;
const brand=s=>`<div class="tl"><i class="logo">KES</i><div class="bt"><b>Kyambogo Engineering Society</b><small>${s}</small></div></div>`;
const hdr=a=>`<header class="top">${brand('Election 2026 · Blueprint')}<nav><a class="${a=='v'?'on':''}">Vote</a><a class="${a=='r'?'on':''}">Results</a><a class="${a=='a'?'on':''}">Apply</a></nav>${cells()}</header>`;
const chdr=(r,on,who)=>`<header class="top">${brand(who+' · Console')}<div class="crumb"><span class="mu">${NAV[r].find(g=>g[1].includes(on))[0]}</span><i>/</i><b>${on}</b></div>${cells()}</header>`;
const pub=(a,body,dock)=>hdr(a)+`<div class="sc"><main class="wrap">${body}</main></div>`+(dock?`<div class="dock">${dock}</div>`:'');
const inp=(l,v,f)=>`<label>${l}</label><div class="in ${f?'f':''} ${v?'':'mu'}">${v||'&nbsp;'}</div>`;
const pl=(t,c)=>`<span class="pill ${c||''}">${t}</span>`;
const cand=(i,n,on)=>`<div class="cand ${on?'on':''}"><i class="av">${i}</i><b>${n}</b><span class="tick">${on?'✓':''}</span></div>`;
const rowb=(n,v,p,w)=>`<div class="row ${w?'w':''}"><div class="t"><span>${n} ${w?pl('Winner'):''}</span><span class="num">${v} · ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
const tbl=(h,rows)=>`<div class="ov"><table class="rs"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${h[i]}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const stat=(n,l)=>`<div class="card stat"><div class="big">${n}</div><div class="mu">${l}</div></div>`;
const NAV={
 sa:[['Election Setup',['Candidates','Positions','Applications','Branding','Election']],['People & Roles',['Commission','Voters','IT Admins','Financial Controllers','Overseers','Vetting Panel','Organisations']],['Requests & Access',['Student Changes','Contact Changes','Reset OTP']],['Security',['Security & SMS']],['Platform',['Official Document','Site Usage']]],
 it:[['IT Admin',['Voters','Edit Student','Reset OTP']]],com:[['Oversight',['Overview','Turnout','Audit Log']],['Requests',['Student Changes','Contact Changes']],['Platform',['Final Report']]],
 fin:[['Payments',['Voter payments','Candidate payments']]],vet:[['Vetting',['Applications','My Votes','Panel']]],ov:[['Overseer',['Live Turnout','Alerts','Audit Log']]]};
const shell=(role,on,who,body)=>chdr(role,on,who)+`<div class="shell"><aside class="side">${NAV[role].map(g=>`<h3>${g[0]}</h3>`+g[1].map(x=>`<a class="${x==on?'on':''}">${x}</a>`).join('')).join('')}<h3>Session</h3><a>Log out</a></aside><section class="main"><h1>${on}</h1>${body}</section></div>`;
const P={
spec:()=>hdr('v')+`<div class="sc"><main class="wrap wide"><div class="card"><h1>Spacing</h1><p class="mu">4px base, 8px rhythm. Nothing is padded outside these steps.</p>${[['s1',4],['s2',8],['s3',12],['s4',16],['s5',24],['s6',32],['s7',48]].map(x=>`<div class="sp"><b>${x[0]}</b><i style="width:${x[1]*3}px"></i><span class="mu">${x[1]}px</span></div>`).join('')}</div><div class="card"><h1>Header</h1><p class="mu">Drawing title block: 64px bar, 12px outer margin, 16px cell padding, dashed cell dividers (brand, nav or breadcrumb, status, sheet), 40px logo stamp in a dashed registration frame, ruler edge along the bottom. Mobile: 56px brand row plus a tab row, sheet cell hidden.</p><p class="mu">Page gutter 24px desktop, 16px mobile. Card padding matches the gutter. Card gap 16. Section label 24 above, 12 below. Inputs and buttons 48px tall, 8px between touch targets.</p></div><div class="card"><h1>Tints</h1><p class="mu">Accent at 10% and 18% over the card surface, plus status tints at 10%. Dark mode lifts surfaces lighter instead of adding shadow.</p><div class="sw"><i style="background:var(--bg)">bg</i><i style="background:var(--sf)">card</i><i style="background:var(--sf3)">raised</i><i style="background:var(--tint)">tint</i><i style="background:var(--tint2)">tint 2</i><i style="background:var(--ac);color:var(--ai)">accent</i></div><div style="margin-top:16px">${pl('Approved')} ${pl('Vetting','w')} ${pl('Rejected','n')} ${pl('Unpaid','m')}</div></div><div class="card"><h1>Contrast (WCAG AA)</h1>${tbl(['Pair','Light','Dark'],[['Text on card','16.0','11.0'],['Muted on card','5.7','6.2'],['Button text on accent','5.2','6.9'],['Accent on card','5.2','5.7'],['Status pill text on tint','5.5 to 5.6','5.6 to 6.5']])}</div></main></div>`,
boot:()=>`<div class="cen"><div class="card"><i class="logo">KES</i><h1>Kyambogo Engineering Society</h1><p class="mu">The server is waking up after a period of inactivity. This can take up to a minute.</p><b class="mono" style="font-size:12px;letter-spacing:.1em"><span class="dot"></span>STARTING SERVER</b></div></div>`,
login:()=>pub('v',`<div class="card"><h1>Voter Login</h1><div class="ban">Voting is open · closes 6 Oct, 5:00 PM</div>${inp('Registration number','22/U/1234/EE',1)}${inp('Full name','')}<div class="btn">Verify &amp; Send Code</div><div class="lnk">Are you an admin? Log in here</div></div>`),
otp:()=>pub('v',`<div class="card"><h1>Enter Code</h1><p class="mu">A 6-digit code was sent to 07•• ••• 482.</p><div class="otp"><i>4</i><i>8</i><i>1</i><i>•</i><i></i><i></i></div><div class="btn">Verify &amp; Continue</div><div class="lnk">Resend code in 0:42</div><div class="lnk mu">No SMS? Contact the IT administrators.</div></div>`),
ballot:()=>pub('v',`<h1 style="text-align:center">KES Election 2026</h1><div class="steps"><i class="on"></i><i class="on"></i><i></i></div><div class="pos">President</div>${cand('AO','Achieng Olivia',1)}${cand('MK','Mugisha Kenneth')}<div class="pos">Vice President</div>${cand('NB','Nakato Brenda')}${cand('OD','Okello Daniel')}<div class="pos">Secretary General</div>${cand('TS','Tumusiime Sarah')}`,`<div class="btn g">Clear All</div><div class="btn">Review Ballot</div>`),
review:()=>pub('v',`<div class="card"><h1>Review Your Ballot</h1><p class="mu">Your vote cannot be changed after submission.</p>${[['President','Achieng Olivia'],['Vice President','Nakato Brenda'],['Secretary General','Tumusiime Sarah']].map(x=>`<div class="row"><div class="t"><span class="mu">${x[0]}</span><b>${x[1]}</b></div></div>`).join('')}<div class="btn">Submit Vote</div><div class="btn g">Go Back</div></div>`),
done:()=>pub('v',`<div class="card stat"><div class="big">✓</div><h1>Vote Recorded</h1><p class="mu">Thank you for voting. Your receipt code:</p><div class="in mono" style="text-align:center;letter-spacing:.15em">KES-7Q4M-92XD</div><div class="btn g">View Results</div></div>`),

const L=[['spec','Spacing & tint spec'],['boot','Boot'],['login','Voter login'],['otp','OTP'],['ballot','Ballot'],['review','Review'],['done','Vote done'],['results','Results'],['apply','Apply'],['sa','SA · Applications'],['voters','SA · Voters'],['chg','SA · Student changes'],['usage','SA · Site usage'],['it','IT admin · Edit'],['com','Commission'],['fin','Finance'],['vet','Vetting panel'],['ov','Overseer']];
$('#pg').innerHTML=L.map(x=>`<option value=${x[0]}>${x[1]}</option>`).join('');
function go(){document.querySelectorAll('.tb button[data-k]').forEach(b=>b.classList.toggle('on',S[b.dataset.k]==b.dataset.v));
const m=S.v=='mobile',d=$('#dev'),st=$('#st');$('#pg').value=S.p;d.dataset.t=S.t;d.className='dev'+(m?' m':'')+(+S.g?' gd':'');
const W=m?390:1280,H=m?800:800,k=Math.min(1,(st.clientWidth-24)/W);d.style.width=W+'px';d.style.height=H+'px';$('#sc').style.transform=`scale(${k})`;$('#sc').style.width=W+'px';$('#sc').style.height=H*k+'px';$('#sc').style.marginBottom=(H*k-H)+'px';
d.innerHTML=P[S.p]();$('#gd').textContent=+S.g?'On':'Off';location.hash=`g=${S.g}&t=${S.t}&v=${S.v}&p=${S.p}`}
document.querySelectorAll('.tb button[data-k]').forEach(b=>b.onclick=()=>{S[b.dataset.k]=b.dataset.v;go()});
$('#pg').onchange=e=>{S.p=e.target.value;go()};const step=n=>{let i=L.findIndex(x=>x[0]==S.p);S.p=L[(i+n+L.length)%L.length][0];go()};$('#gd').onclick=()=>{S.g=+S.g?0:1;go()};$('#pv').onclick=()=>step(-1);$('#nx').onclick=()=>step(1);addEventListener('resize',go);go();
</script></body></html>
